name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: isRoomCold
      id: isroomcold
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: isRoomCold
        setup-command: ''
        command: gradle test --tests TestStudentCode.testIsRoomCold*
        timeout: 5
        max-score: 6
    - name: fullName
      id: fullname
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: fullName
        setup-command: ''
        command: gradle test --tests TestStudentCode.testFullName*
        timeout: 5
        max-score: 4
    - name: calculateAverage
      id: calculateaverage
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: calculateAverage
        setup-command: ''
        command: gradle test --tests TestStudentCode.testCalculateAverage*
        timeout: 5
        max-score: 4
    - name: bigVowel
      id: bigvowel
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: bigVowel
        setup-command: ''
        command: gradle test --tests TestStudentCode.testBigVowel*
        timeout: 5
        max-score: 8
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        ISROOMCOLD_RESULTS: "${{steps.isroomcold.outputs.result}}"
        FULLNAME_RESULTS: "${{steps.fullname.outputs.result}}"
        CALCULATEAVERAGE_RESULTS: "${{steps.calculateaverage.outputs.result}}"
        BIGVOWEL_RESULTS: "${{steps.bigvowel.outputs.result}}"
      with:
        runners: isroomcold,fullname,calculateaverage,bigvowel
